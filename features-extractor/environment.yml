# conda env create -f environment.yml   (exact versions: same versions + same models = same numbers)
# torch 2.4.1 from PyPI bundles CUDA 12.1 (needs an NVIDIA driver >= 525 on the GPU node).
name: fx
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - conda-pack
  - pip:
      - numpy==1.26.4
      - scipy==1.13.1
      - pyyaml==6.0.2
      - soundfile==0.12.1
      - librosa==0.10.2.post1
      - numba==0.60.0
      - llvmlite==0.43.0
      - torch==2.4.1
      - torchaudio==2.4.1          # AST's exact (Kaldi) input features; same version as torch
      - transformers==4.44.2
      - tokenizers==0.19.1
      - huggingface_hub==0.24.6
      - safetensors==0.4.5
      - pytest==8.3.3
